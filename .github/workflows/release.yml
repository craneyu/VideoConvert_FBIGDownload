name: "publish"

# Triggered by version tags, not by every push to main. Pushing to main used to
# rerun a three-platform build (~10 minutes) and re-upload assets onto the release
# that the unchanged version number already resolved to.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's safe to always print them
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # fallback in case we add linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm install

      # The Windows decode capability query is behind #[cfg(target_os = "windows")],
      # so it is not compiled — let alone executed — by a macOS run. Without this step
      # the only place those tests ever run is a developer machine.
      #
      # This runner is also the "no decoder installed" half of the two environments
      # the capability query has to answer correctly in: a GitHub image carries no AV1
      # Video Extension, so the query must answer Unsupported here, while a desktop
      # with the extension answers Supported.
      - name: run Rust unit tests (windows only)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        env:
          # Declares the answer this environment must give for AV1 — see the same
          # variable in test.yml for why a runner is the "no decoder" half.
          VIDBRIDGE_EXPECT_AV1_DECODE: unsupported
        run: cargo test --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action replaces this with the app version from tauri.conf.json
          releaseName: "VidBridge v__VERSION__"
          releaseBody: |
            See the assets below to download the latest version of VidBridge.

            ---

            ### 本版變更

            **下載後處理與轉檔改為共用同一份「編碼名額」。**

            過去這兩件事互不知情，而影片編碼本來就會吃滿所有 CPU 核心 —— 兩個編碼
            同時跑是把彼此速度砍半，不是加總。轉檔頁籤更是完全沒有上限，連點五次
            就會同時開五個編碼行程。現在兩者共用一個上限（預設一次一個）。

            **同時下載數量與同時編碼數量可在「軟體設定 → 並行處理」調整。**

            - 同時下載：預設 3（原本固定 2），可設 1–8，**立即生效**
            - 同時編碼：預設 1，可設 1–2，**變更後需重新啟動**
              （設為 2 是為了讓程式保持回應，不會更快）

            **新增「等待編碼」狀態。** 已下載完成、正在排隊等編碼的任務會明確顯示
            為等待中，而不是讓進度條停在同一個數字不動。這類任務也不再佔用下載
            名額 —— 下載完成的當下，下一支就會開始下載，不必等前一支編碼完成。

            **容器最佳化（remux）不再排隊。** 來源已是相容格式時只做容器轉換，
            成本接近零，因此不佔用編碼名額。

            ---

            ### 畫質改善

            **音訊不再被二次壓縮。** 來源音訊已是 AAC 時直接沿用，不再重新編碼。
            過去即使來源是 AAC 也一律轉成 128k —— 檔案變大、音質變差。實測一支
            Facebook Reel：來源 59959 bps 被拉到 128385 bps。

            **可以播放時就保留原始畫質。** Facebook 的 1080p 只提供 AV1 格式，而
            過去一律重新編碼成 H.264，代價是檔案大 53%、慢約 200 倍、且畫質有可
            測量的損失。現在若偵測到本機能解碼該格式，就直接保留原始串流：畫質
            無損、檔案更小、幾乎瞬間完成。

            可在「軟體設定 → 轉檔品質配置 → 下載影片的處理方式」選擇：

            - **自動判斷**（預設）：能解碼就保留原檔，否則重新編碼
            - **保留原檔**：一律保留，不重新編碼
            - **相容優先**：一律重新編碼為 H.264（0.1.5 及之前的行為）

            > ⚠️ **這會改變預設的輸出格式。** 在支援 AV1 的機器上，下載 Facebook
            > Reel 的結果會是 AV1 而非 H.264。畫質更好、檔案更小，但**把該檔案帶到
            > 不支援 AV1 的裝置上可能無法播放** —— 偵測只反映下載的這台機器，無法
            >知道你之後在哪裡播放。若你會把檔案傳給別人或轉到舊裝置，請改選
            > 「相容優先」。

            macOS 與 Windows 都會做自動偵測，方式不同：macOS 查詢 VideoToolbox 的
            硬體解碼能力，Windows 列舉 Media Foundation 註冊的解碼器（**軟體解碼也
            算**）。因此同一台電腦在兩個系統上的答案可能不同 —— 沒有 AV1 硬體解碼但
            裝了解碼器的機器，Windows 會保留原檔，macOS 則會重新編碼。

            **Linux 一律視為無法確認**，自動判斷會保守地重新編碼；若要保留原檔請手動
            選擇「保留原檔」。

            Windows 使用者請注意：Windows 11 24H2 之後內建 AV1 解碼，較舊的版本可從
            Microsoft Store 安裝 AV1 Video Extension。**只要偵測到解碼器，自動判斷就
            會保留 AV1 原檔，輸出格式因此與 0.1.6 及之前不同** —— 這正是上面那個輸出
            格式警告描述的情況。若你會把檔案帶到別的裝置，請改選「相容優先」。

            ### ⚠️ 仍在 0.1.3 的使用者請注意

            0.1.4 更換過更新簽章金鑰，而 0.1.3 內嵌的是舊公鑰，**無法透過自動更新
            升級** —— 請從下方資產手動下載安裝一次，之後的自動更新就會恢復正常。
            （0.1.3 及之前的自動更新因設定錯誤本來就無法運作。）

            0.1.4 與 0.1.5 的使用者可直接透過自動更新升級到本版。
          # Must not be a draft or prerelease: the updater endpoint resolves through
          # /releases/latest/download/, which skips both.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 0.1.3 發佈時三個平台全部成功，但沒有任何 .sig 產生，因而也沒有 latest.json，
  # 自動更新 endpoint 從發佈起就是 404 —— 兩個月無人察覺，因為建置本身是綠的。
  # 「建置成功」不等於「更新可用」，所以在此對 endpoint 本身做一次驗證。
  verify-updater-manifest:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # tauri-action 以 tauri.conf.json 的 version 決定 tag，這裡用同一個來源推導，
      # 才能同時適用於 tag push 與 workflow_dispatch（後者 ref_name 是分支不是 tag）。
      - name: resolve release tag
        id: tag
        run: echo "tag=v$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: assert latest.json was attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets"
          if ! grep -qx 'latest.json' <<<"$assets"; then
            echo "::error::$TAG 沒有 latest.json。簽章未產生時 tauri-action 會靜默略過此檔，"
            echo "::error::請確認 bundle.createUpdaterArtifacts 為 true，且兩個簽章 secret 都有效。"
            exit 1
          fi
          # .sig 只給 warning 而非擋下：更新能否運作取決於 latest.json 裡的
          # signature 欄位（下一個步驟會逐一斷言），至於 tauri-action 是否另外
          # 把 .sig 原始檔也上傳成 release 資產，屬於它的打包細節。以此擋下發佈
          # 會誤殺一個自動更新其實正常的版本。留 warning 是因為 0.1.3 正是零
          # .sig，這個訊號仍值得出現在 log 裡。
          if ! grep -q '\.sig$' <<<"$assets"; then
            echo "::warning::$TAG 沒有任何 .sig 資產。若下一步的簽章斷言通過則不影響自動更新。"
          fi

      # 資產存在不代表 app 取得到它：/releases/latest/ 會跳過 draft 與 prerelease，
      # 而 app 內嵌的 endpoint 走的正是這條路徑。
      - name: assert the updater endpoint actually resolves
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          # release 剛建立時 /releases/latest 的解析偶有延遲，重試而非立刻判定失敗。
          # `|| code=000`：curl 遇到網路層錯誤（DNS、連線失敗）會回非零退出碼，
          # 在 set -e 下會當場中止整個步驟 —— 重試不會發生，下方的診斷訊息也不會
          # 印出。000 是 curl 表示「沒有收到 HTTP 回應」的慣例值。
          for attempt in 1 2 3 4 5; do
            code=$(curl -sL -o manifest.json -w '%{http_code}' "$url") || code=000
            [ "$code" = "200" ] && break
            # 中文標點緊接變數時一律用 ${}：不加大括號時，變數名的邊界由 shell
            # 對多位元組字元的處理決定，並非所有 shell 都會在此正確斷開。
            echo "第 ${attempt} 次取得 ${code}，10 秒後重試"
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::error::${url} 回應 ${code}。若資產存在卻仍 404，多半是該 release 被標為 prerelease 或 draft。"
            exit 1
          fi
          # 每個 jq 斷言都自帶訊息：靠 set -e 讓 jq 的退出碼中止步驟固然有效，
          # 但 CI log 只會顯示「步驟失敗」而不說是哪一項不合格。
          if ! jq -e '.version and .platforms and (.platforms | length > 0)' manifest.json > /dev/null 2>&1; then
            echo "::error::latest.json 結構不完整，version 或 platforms 缺漏／為空。內容如下："
            cat manifest.json
            exit 1
          fi
          # 版號必須對得上這次發佈，否則代表 /releases/latest 指向的是舊的 release。
          got=$(jq -r .version manifest.json)
          if [ "$got" != "${TAG#v}" ]; then
            echo "::error::latest.json 的版本是 ${got}，但這次發佈的是 ${TAG#v}。"
            exit 1
          fi
          # 每個平台都必須帶簽章，否則該平台的使用者會在驗證階段失敗。
          if ! jq -e 'all(.platforms[]; .signature != null and .signature != "")' manifest.json > /dev/null 2>&1; then
            echo "::error::下列平台缺少簽章："
            jq -r '.platforms | to_entries[] | select(.value.signature == null or .value.signature == "") | .key' manifest.json
            exit 1
          fi
          echo "updater manifest 驗證通過：${got}，涵蓋平台："
          jq -r '.platforms | keys[]' manifest.json
