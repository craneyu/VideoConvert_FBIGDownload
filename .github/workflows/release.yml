name: "publish"

# Triggered by version tags, not by every push to main. Pushing to main used to
# rerun a three-platform build (~10 minutes) and re-upload assets onto the release
# that the unchanged version number already resolved to.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's safe to always print them
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # fallback in case we add linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action replaces this with the app version from tauri.conf.json
          releaseName: "VidBridge v__VERSION__"
          releaseBody: |
            See the assets below to download the latest version of VidBridge.

            ---

            ### ⚠️ 既有 0.1.3 使用者請注意

            本版更換了更新簽章金鑰。舊版內嵌的是舊公鑰，無法驗證新版簽章，因此
            **無法透過自動更新升級** —— 請從下方資產手動下載安裝一次，之後的自動
            更新就會恢復正常。

            （0.1.3 及之前的自動更新因設定錯誤本來就無法運作，此次更換不會讓任何
            原本可用的功能失效。）
          # Must not be a draft or prerelease: the updater endpoint resolves through
          # /releases/latest/download/, which skips both.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
